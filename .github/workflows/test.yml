name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned to a specific image so image upgrades don't silently flip the
    # goldens (the algorithm's stopping point depends on FP rounding from
    # gfortran/openblas, which differ across runner image versions).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gfortran libopenblas-dev liblapack-dev python3

      # Force OpenBLAS as the active BLAS/LAPACK provider. The runner image
      # may have reference BLAS preselected via update-alternatives, which
      # produces different FP rounding than OpenBLAS and breaks the goldens.
      - name: Pin BLAS implementation to OpenBLAS
        run: |
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu \
            /usr/lib/x86_64-linux-gnu/openblas-pthread/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu \
            /usr/lib/x86_64-linux-gnu/openblas-pthread/liblapack.so.3
          echo "Active BLAS:"
          update-alternatives --display libblas.so.3-x86_64-linux-gnu | head -4
          echo "Active LAPACK:"
          update-alternatives --display liblapack.so.3-x86_64-linux-gnu | head -4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run integration tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Upload test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: build/tests/*/output.json
          if-no-files-found: ignore
